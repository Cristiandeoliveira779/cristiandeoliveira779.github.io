<body>
    <header>

        <nav>
            <a href="index.html">홈</a> |
            <a href="about.html">소개</a> |

            <a href="contact.html">문의하기</a>
        </nav>

    <main>
        <section>
            <h2>문의 및 제휴 안내</h2>
            <p>궁금한 점이 있으시다면 아래 양식을 작성해 주시거나 직접 이메일로 연락해 주세요.</p>
            <p><strong>직접 문의 이메일:</strong> <a href="mailto:yeonjun050727@gmail.com">yeonjun050727@gmail.com</a></p>

            <form action="#" method="post">
                <div>
                    <label for="name">성함 / 닉네임:</label><br>
                    <input type="text" id="name" name="name" required placeholder="성함을 입력하세요">
                </div>
                <br>
                <div>
                    <label for="email">이메일 주소:</label><br>
                    <input type="email" id="email" name="email" required placeholder="답변받으실 이메일을 입력하세요">
                </div>
                <br>
                <div>
                    <label for="message">문의 내용:</label><br>
                    <textarea id="message" name="message" rows="6" required placeholder="문의하실 내용을 작성하세요"></textarea>
                </div>
                <br>
                <button type="submit">문의 보내기</button>
            </form>
        </section>
    </main>
