<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>통합 블로그 허브</title>

  <!-- [구글 애드센스 승인/연동 코드 위치] -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <!-- 프리텐다드 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 20px -5px rgba(37, 99, 235, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 애드센스 영역 */
    .adsense-box {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 25px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* 블로그 섹션 카드 */
    .blog-section {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-md);
    }

    .blog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    .blog-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .visit-btn {
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .visit-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* 가로 스크롤 포스트 리스트 */
    .post-list-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* 스크롤바 디자인 */
    .post-list-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .post-list-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .post-list-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .post-list-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 컴팩트형 카드 디자인 */
    .post-card-mini {
      flex: 0 0 160px; /* 카드 폭을 160px로 고정해 아담하게 설정 */
      background: #ffffff;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .post-card-mini:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .post-thumb-wrapper-mini {
      width: 100%;
      height: 110px;
      overflow: hidden;
      background-color: #f1f5f9;
      position: relative;
    }

    .post-thumb-mini {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .post-card-mini:hover .post-thumb-mini {
      transform: scale(1.05);
    }

    .post-content-mini {
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .post-title-mini {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 6px 0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 35px; /* 제목 2줄 높이 고정 */
    }

    .post-date-mini {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 4px;
    }

    /* 로딩 스타일 */
    .loading {
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
      font-size: 13px;
      width: 100%;
    }

    @media (max-width: 640px) {
      body {
        padding: 15px 10px;
      }
      .blog-section {
        padding: 15px;
      }
      .post-card-mini {
        flex: 0 0 140px; /* 모바일에서는 더 아담하게 */
      }
      .post-thumb-wrapper-mini {
        height: 95px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- [상단 애드센스 영역] -->
  <div class="adsense-box">
    📢 광고 영역 (구글 애드센스 승인 후 배너 노출)
  </div>

  <!-- 1번 블로그 -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">💡 실생활 유용한 정보</h2>
      <a class="visit-btn" href="https://blog.naver.com/blogforyou_" target="_blank">블로그 바로가기</a>
    </div>
    <div id="posts-blog1" class="post-list-scroll">
      <div class="loading">최신글을 불러오는 중...</div>
    </div>
  </div>

  <!-- 2번 블로그 -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">🛍️ 상품 리뷰 & 추천</h2>
      <a class="visit-btn" href="https://blog.naver.com/727--" target="_blank">블로그 바로가기</a>
    </div>
    <div id="posts-blog2" class="post-list-scroll">
      <div class="loading">최신글을 불러오는 중...</div>
    </div>
  </div>

  <!-- 3번 블로그 -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">📰 국내외 이슈 & 트렌드</h2>
      <a class="visit-btn" href="https://blog.naver.com/tip-foryou" target="_blank">블로그 바로가기</a>
    </div>
    <div id="posts-blog3" class="post-list-scroll">
      <div class="loading">최신글을 불러오는 중...</div>
    </div>
  </div>

  <!-- [하단 애드센스 영역] -->
  <div class="adsense-box">
    📢 광고 영역 (구글 애드센스 승인 후 배너 노출)
  </div>

</div>

<script>
  window.onload = function() {
    loadBlogRSS('blogforyou_', 'posts-blog1');
    loadBlogRSS('727--', 'posts-blog2');
    loadBlogRSS('tip-foryou', 'posts-blog3');
  };

  function loadBlogRSS(blogId, containerId) {
    const rssUrl = `https://rss.blog.naver.com/${blogId}.xml`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div class="loading">최신 글이 없습니다.</div>';
          return;
        }

        const posts = data.items.slice(0, 8); // 가로 스크롤에 맞게 최신글 8개까지 노출

        posts.forEach(post => {
          let imageUrl = '';
          if (post.thumbnail) {
            imageUrl = post.thumbnail;
          } else if (post.enclosure && post.enclosure.link) {
            imageUrl = post.enclosure.link;
          } else {
            const imgMatch = post.description.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (imgMatch && imgMatch[1]) {
              imageUrl = imgMatch[1];
            } else {
              imageUrl = 'https://cdn-icons-png.flaticon.com/512/3959/3959542.png';
            }
          }

          if (imageUrl.includes('postfiles.naver.net') || imageUrl.includes('blogfiles.naver.net')) {
            imageUrl = 'https://search.pstatic.net/common/?src=' + encodeURIComponent(imageUrl);
          }

          const pubDate = new Date(post.pubDate);
          const formattedDate = `${pubDate.getFullYear()}.${pubDate.getMonth() + 1}.${pubDate.getDate()}`;

          const card = document.createElement('div');
          card.className = 'post-card-mini';
          card.onclick = () => window.open(post.link, '_blank');

          card.innerHTML = `
            <div class="post-thumb-wrapper-mini">
              <img class="post-thumb-mini" src="${imageUrl}" referrerpolicy="no-referrer" alt="썸네일" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3959/3959542.png'">
            </div>
            <div class="post-content-mini">
              <div class="post-title-mini" title="${post.title}">${post.title}</div>
              <div class="post-date-mini">${formattedDate}</div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        const container = document.getElementById(containerId);
        container.innerHTML = '<div class="loading">불러오기 실패</div>';
      });
  }
</script>

</body>
</html>
