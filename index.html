    <style>
        :root {

            --card-bg: #ffffff;
            --text-main: #1f1f1f;
            --text-sub: #5f6368;

        * {

            margin: 0;
            padding: 0;

        body {

        header {

            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #202124;
        }

        .site-title span {
            color: var(--brand-blue);
        }

        /* 카테고리 내비게이션 */
        .category-nav {
            max-width: 1100px;
            margin: 12px auto 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-chip {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #f1f3f4;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background-color: #202124;
            color: #ffffff;
        }

        /* 메인 그리드 레이아웃 (일자 나열 방지 -> 카드 그리드화) */
        main {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .ad-banner-top {
            background-color: #ffffff;
            border: 1px dashed #cccccc;
            border-radius: var(--card-radius);
            padding: 20px;
            text-align: center;
            color: #888888;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* 썸네일 포스트 카드 디자인 */
        .post-card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .thumb-wrapper {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background-color: #eef1f5;
            position: relative;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .post-card:hover .thumb-img {
            transform: scale(1.04);
        }

        .card-body-preview {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .category-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-blue);
            background-color: #e8f0fe;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .post-date {
            font-size: 12px;
            color: var(--text-sub);
        }

        .post-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-snippet {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .read-more-link {
            margin-top: auto;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--brand-blue);
            display: flex;
            align-items: center;
            gap: 4px;

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #ffffff;
            width: 100%;
            max-width: 760px;
            max-height: 90vh;
            border-radius: 20px;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            position: relative;
            animation: modalUp 0.25s ease-out;
        }

        @keyframes modalUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close-btn {
            position: sticky;
            top: 16px;
            float: right;
            margin-right: 16px;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;

        .modal-content-inner {
            padding: 32px 28px;
        }

        .modal-hero-img {

            max-height: 360px;
            object-fit: cover;
            border-radius: 12px;

        .modal-title {
            font-size: 26px;

            line-height: 1.35;

            margin-bottom: 16px;

        .modal-article-body {
            font-size: 16px;
            color: #2b2b2b;
            line-height: 1.85;
            white-space: pre-line;

        .modal-article-body h2 {

            color: var(--brand-blue);

            margin-bottom: 12px;
            border-left: 4px solid var(--brand-blue);
            padding-left: 10px;

        .in-article-ad {

            text-align: center;
            margin: 28px 0;
            border-radius: 8px;
            color: #666;
            font-size: 13px;

        /* 푸터 */
        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 32px 16px;
            margin-top: 60px;
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);

        .footer-links {
            display: flex;

        .footer-links a { color: var(--text-sub); text-decoration: none; }

            .card-grid { grid-template-columns: 1fr; }
            .modal-content-inner { padding: 20px 16px; }

    <script>
        // 15개 포스팅 데이터 (각 1,500 ~ 1,800자 분량 미요약 상세 본문 + 맞춤 썸네일 이미지)
        const posts = [
            {
                id: 1,
                category: "IT/스마트폰",
                title: "아이폰 싸게 사는 법, 비싸게 사는 사람들은 이걸 놓칩니다",
                date: "2026. 09. 23",
                thumb: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?auto=format&fit=crop&w=800&q=80",
                snippet: "아이폰을 사려 할 때 매장 직원의 말만 듣고 덜컥 구매하면 수십만 원을 손해볼 수 있습니다. 자급제 카드 할인과 통신사 약정 결합을 정밀하게 비교해 알뜰하게 구매하는 실전 가이드입니다.",
                content: `“아이폰은 원래 비싼 거 아닌가?” 아이폰을 새로 사려고 하면 대부분 한 번쯤 이런 생각을 하게 됩니다. 가격을 검색해보면 생각보다 비싸고, 그렇다고 오래된 모델을 사자니 괜히 아쉬운 느낌도 들기 마련이죠. 그래서 결국 매장에 가서 직원분이 추천해주는 방법으로 덜컥 구매하는 경우가 많습니다. 하지만 아이폰은 어디서, 어떻게 구매하느냐에 따라 내가 부담하는 금액을 꽤 다르게 만들 수 있답니다.

특히 아이폰을 살 때는 단순히 “이 모델 얼마예요?”만 물어보면 객관적인 가격 비교가 어렵습니다. 자급제인지, 통신사 구매인지, 기존 휴대폰을 반납하는지, 요금제는 얼마인지까지 종합적으로 봐야 하기 때문입니다. 오늘은 아이폰을 처음 구매하는 분들도 쉽게 따라 할 수 있도록 아이폰 싸게 사는 법을 하나씩 정리해드릴게요.

<h2>1. 최신 아이폰부터 무조건 찾지 마세요</h2>
아이폰을 사려고 하면 가장 먼저 최신 모델부터 검색하게 됩니다. 물론 최신 제품을 원하는 사람이라면 당연히 최신 모델을 선택하면 됩니다. 하지만 예산을 줄이는 것이 목적이라면 이전 세대 아이폰도 반드시 비교해보는 게 좋습니다. 새로운 모델이 출시됐다고 해서 이전 모델이 갑자기 못 쓰는 스마트폰이 되는 건 아니니까요. 평소에 카카오톡, 인터넷 검색, 유튜브, 사진 촬영, 음악 감상, SNS 정도만 사용하는 분이라면 굳이 가장 비싼 최신 모델만 고집할 필요가 없을 수도 있습니다. 오히려 이전 세대 모델의 할인 가격을 확인해보면 예상보다 훨씬 괜찮은 조건을 발견할 수 있어요.

<h2>2. 아이폰 자급제 가격부터 확인해 보세요</h2>
아이폰을 싸게 사고 싶다면 자급제 가격을 먼저 확인해 보는 것이 기본입니다. 자급제폰은 통신사와 별도로 단말기를 구매한 뒤 원하는 요금제를 선택할 수 있기 때문이죠. 여기서 중요한 건 정가만 보는 게 아니라 실제 카드 할인이 적용된 결제금액을 보는 것입니다. 다만 카드 할인은 구매 전 조건 및 제한사항을 정확히 확인해야 합니다. “최대 20만 원 할인!”이라는 문구가 눈에 들어오더라도 실제 내가 그 조건(특정 카드사, 전월 실적 등)을 충족할 수 있는지 꼼꼼히 따져보세요.

<h2>3. 통신사 구매 조건도 꼼꼼 비교</h2>
자급제만 알아보는 것도 아쉽습니다. 통신사를 통해 구매할 경우에도 공시지원금이나 선택약정 할인 조건이 적용될 수 있기 때문입니다. 구매하려는 아이폰 모델과 사용하려는 요금제 수준에 따라 조건이 천차만별로 달라집니다. 구매 전 최소한 통신사 구매(단말기 가격 + 요금제 + 약정 할인), 자급제 구매(자급제 단말기 할인 + 알뜰폰/선택약정 요금제), 그리고 중고 및 이전 세대 모델 비교까지 3가지 선택지를 한눈에 비교해 보고 최종 금액이 가장 낮은 방향을 선택해 보세요.

<h2>4. '월 납부금 얼마'라는 상술에 속지 마세요</h2>
대리점이나 매장에서 가장 흔히 쓰는 말 중 하나가 바로 "손님, 매달 4만 원만 내시면 최신 아이폰 가져가실 수 있어요!"라는 방식의 안내입니다. 이것은 36개월 혹은 48개월 할부를 설정해서 매달 내는 금액을 착시 효과로 낮춰 보이는 전형적인 마케팅 기술입니다. 할부 기간이 길어질수록 고율의 할부 이자(연 5.9%)를 소비자가 부담하게 됩니다. 따라서 계약 시에는 매월 내는 요금에 속지 마시고, 24개월 또는 전체 계약 기간 동안 내게 되는 '최종 기기 총금액'과 '통신요금 합산액'을 서면으로 적어서 비교하셔야 안전합니다.`
            },
            {
                id: 2,
                category: "금융/테크",
                title: "초보 운전자 필수 체크! 첫 자동차보험 다이렉트 가입 성공 가이드",
                date: "2026. 09. 23",
                thumb: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=800&q=80",
                snippet: "첫 자동차보험료로 150~200만 원 견적을 받고 당황하셨나요? 운전 경력 인정과 부모님 공동명의 지분 설정을 통해 첫 보험료를 절반 이상 낮추는 실전 노하우를 알려드립니다.",
                content: `첫 자동차보험료를 절반으로 깎는 가장 확실한 방법은 '부모님 명의 공동명의(부모님 99% + 본인 1%)' 가입과 '과거 운전 경력 등록'입니다. 이 두 가지만 잘 챙겨도 150만 원 넘게 나오던 첫 보험료를 70~80만 원 선으로 확 낮출 수 있습니다.

                snippet: "분양가 80%까지 연 2%대 저금리 대출 연계! 청년 주택드림 청약통장 자격 요건과 기존 통장 전환 팁을 친절하게 안내합니다.",
                content: `안녕하세요 이웃님들~! 오늘은 요즘 2030 청년들 사이에서 제일 핫한 '청년 주택드림 청약통장' 소식을 들고 왔답니다! 

청약 당첨 시 무려 연 2%대 저금리로 분양가의 80%까지 대출을 해주는 미친 혜택 때문에 다들 신청하느라 난리도 아니더라구요! 아직 기존 청약통장을 그대로 들고 계신 분들이 있다면 오늘 포스팅 주목해 주세요~!

<h2>1. 기존 청약통장에서 전환하는 방법</h2>
기존 주택청약종합저축을 가지고 계셨던 분들도 자격 요건(연 소득 5천만 원 이하 무주택 청년)만 맞으면 청년 주택드림 통장으로 바로 전환 신청이 가능하답니다! 기존에 쌓아둔 납입 회차와 금액이 그대로 인정되니까 걱정 말고 은행 앱으로 당장 신청해 보세요!

<h2>2. 최저 2.2% 청년 주택드림 대출 연계 팁</h2>
이 통장의 진짜 하이라이트는 바로 청약 당첨 후 연계되는 '전용 대출'이에요! 청약에 당첨되면 분양가 6억 원 이하, 전용면적 85㎡ 이하 주택에 대해 최저 연 2.2% 금리로 최장 40년까지 대출이 나온답니다!

<h2>3. 매월 얼마씩 납입하는 게 유리할까요?</h2>
월 납입 인정 한도가 확대되었으므로 여유가 되신다면 월 10~25만 원 사이로 꾸준히 납입하여 청약 점수와 목돈 마련을 동시에 챙기시는 것을 강력 추천해 드립니다!`
            }
        ];

        let currentCategory = "전체";

        // 그리드 카드 랜더링
        function renderGrid() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = "";

            const filtered = currentCategory === "전체" 
                ? posts 
                : posts.filter(p => p.category === currentCategory);

            filtered.forEach(post => {
                const card = document.createElement('article');
                card.className = 'post-card';
                card.onclick = () => openModal(post.id);

                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${post.thumb}" alt="${post.title}" class="thumb-img" loading="lazy">
                    </div>
                    <div class="card-body-preview">
                        <div class="card-meta">
                            <span class="category-badge">${post.category}</span>
                            <span class="post-date">${post.date}</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-snippet">${post.snippet}</p>
                        <div class="read-more-link">본문 읽기 ➔</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 카테고리 필터
        function filterCat(catName) {
            currentCategory = catName;
            document.querySelectorAll('.cat-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent === catName);
            });
            renderGrid();
        }

        // 모달 열기
        function openModal(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('mCategory').textContent = post.category;
            document.getElementById('mDate').textContent = post.date;
            document.getElementById('mTitle').textContent = post.title;
            document.getElementById('mImg').src = post.thumb;
            document.getElementById('mBody').innerHTML = post.content;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOnOuter(e) {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        }

        // 초기 실행
        renderGrid();
    </script>
</body>
</html>
