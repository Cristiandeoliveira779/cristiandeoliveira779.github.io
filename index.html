<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>통합 블로그 허브</title>

  <!-- [구글 애드센스 승인/연동 코드 위치] -->
  <!-- 승인 신청 시 주석(<!-- -->)을 제거하고 본인 ca-pub 코드를 넣으세요 -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <!-- 프리텐다드 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 30px -10px rgba(37, 99, 235, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 애드센스 영역 */
    .adsense-box {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 25px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* 블로그 섹션 카드 */
    .blog-section {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 25px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-md);
    }

    .blog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .blog-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .visit-btn {
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .visit-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* 포스트 카드 리스트 */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post-card {
      display: flex;
      background: #ffffff;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
    }

    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .post-thumb-wrapper {
      width: 115px;
      height: 115px;
      flex-shrink: 0;
      overflow: hidden;
      background-color: #f1f5f9;
      position: relative;
    }

    .post-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .post-card:hover .post-thumb {
      transform: scale(1.05);
    }

    .post-content {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
      min-width: 0;
    }

    .post-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 6px 0;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-desc {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0 0 10px 0;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 로딩 스타일 */
    .loading {
      text-align: center;
      color: var(--text-sub);
      padding: 30px;
      font-size: 14px;
      font-weight: 500;
    }

    @media (max-width: 640px) {
      body {
        padding: 15px 10px;
      }
      .blog-section {
        padding: 16px;
      }
      .post-thumb-wrapper {
        width: 95px;
        height: 95px;
      }
      .post-content {
        padding: 10px 12px;
      }
      .post-title {
        font-size: 14px;
      }
      .post-desc {
        font-size: 12px;
        -webkit-line-clamp: 1;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- [상단 애드센스 영역] -->
  <div class="adsense-box">
    📢 광고 영역 (구글 애드센스 승인 후 배너 노출)
  </div>

  <!-- 1번 블로그 -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">💡 실생활 유용한 정보</h2>
      <a class="visit-btn" href="https://blog.naver.com/blogforyou_" target="_blank">블로그 바로가기</a>
    </div>
    <div id="posts-blog1" class="post-list">
      <div class="loading">최신글과 썸네일을 불러오는 중...</div>
    </div>
  </div>

  <!-- 2번 블로그 -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">🛍️ 상품 리뷰 & 추천</h2>
      <a class="visit-btn" href="https://blog.naver.com/727--" target="_blank">블로그 바로가기</a>
    </div>
    <div id="posts-blog2" class="post-list">
      <div class="loading">최신글과 썸네일을 불러오는 중...</div>
    </div>
  </div>

  <!-- 3번 블로그 -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">📰 국내외 이슈 & 트렌드</h2>
      <a class="visit-btn" href="https://blog.naver.com/tip-foryou" target="_blank">블로그 바로가기</a>
    </div>
    <div id="posts-blog3" class="post-list">
      <div class="loading">최신글과 썸네일을 불러오는 중...</div>
    </div>
  </div>

  <!-- [하단 애드센스 영역] -->
  <div class="adsense-box">
    📢 광고 영역 (구글 애드센스 승인 후 배너 노출)
  </div>

</div>

<script>
  window.onload = function() {
    loadBlogRSS('blogforyou_', 'posts-blog1');
    loadBlogRSS('727--', 'posts-blog2');
    loadBlogRSS('tip-foryou', 'posts-blog3');
  };

  // GitHub Pages(브라우저)에서 네이버 블로그 RSS와 썸네일을 불러오는 기능
  function loadBlogRSS(blogId, containerId) {
    const rssUrl = `https://rss.blog.naver.com/${blogId}.xml`;
    // CORS 한계 극복을 위한 무료 API 서비스 이용
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div class="loading">최신 글이 없거나 불러올 수 없습니다.</div>';
          return;
        }

        const posts = data.items.slice(0, 5); // 최신글 5개 제한

        posts.forEach(post => {
          // 썸네일 이미지 파싱
          let imageUrl = '';
          if (post.thumbnail) {
            imageUrl = post.thumbnail;
          } else if (post.enclosure && post.enclosure.link) {
            imageUrl = post.enclosure.link;
          } else {
            // 본문 내용 중 <img> 태그 추출
            const imgMatch = post.description.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (imgMatch && imgMatch[1]) {
              imageUrl = imgMatch[1];
            } else {
              imageUrl = 'https://cdn-icons-png.flaticon.com/512/3959/3959542.png';
            }
          }

          // 네이버 이미지 외부 차단 해제 프록시 적용
          if (imageUrl.includes('postfiles.naver.net') || imageUrl.includes('blogfiles.naver.net')) {
            imageUrl = 'https://search.pstatic.net/common/?src=' + encodeURIComponent(imageUrl);
          }

          // 본문 요약 생성
          const cleanDesc = post.description.replace(/<[^>]*>?/gm, '').trim().substring(0, 70) + '...';
          
          // 날짜 포맷
          const pubDate = new Date(post.pubDate);
          const formattedDate = `${pubDate.getFullYear()}.${pubDate.getMonth() + 1}.${pubDate.getDate()}`;

          // 포스트 카드 생성
          const card = document.createElement('div');
          card.className = 'post-card';
          card.onclick = () => window.open(post.link, '_blank');

          card.innerHTML = `
            <div class="post-thumb-wrapper">
              <img class="post-thumb" src="${imageUrl}" referrerpolicy="no-referrer" alt="썸네일" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3959/3959542.png'">
            </div>
            <div class="post-content">
              <div class="post-title" title="${post.title}">${post.title}</div>
              <div class="post-desc">${cleanDesc}</div>
              <div class="post-date">${formattedDate}</div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        const container = document.getElementById(containerId);
        container.innerHTML = '<div class="loading">글을 불러오는 중 오류가 발생했습니다.</div>';
      });
  }
</script>

</body>
</html>
