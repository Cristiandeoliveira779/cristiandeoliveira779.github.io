<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 라이프 & IT 정보 허브</title>
    
    <!-- 구글 애드센스 기본 스크립트 (승인 후 본인의 pub ID로 변경) -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 2rem;
        }

        /* AdSense Placeholder */
        .ads-area {
            background-color: #e9ecef;
            border: 1px dashed #adb5bd;
            text-align: center;
            padding: 1rem;
            margin: 1.5rem 0;
            color: #6c757d;
            font-size: 0.85rem;
        }

        /* Grid Layout for Blog Posts */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-card .category {
            background-color: var(--accent-color);
            color: white;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 4px;
            display: inline-block;
            margin: 1rem 1rem 0 1rem;
        }

        .post-card h3 {
            font-size: 1.1rem;
            margin: 0.5rem 1rem;
            color: var(--primary-color);
        }

        .post-card p {
            font-size: 0.9rem;
            color: #666;
            margin: 0 1rem 1rem 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        aside h3 {
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        aside ul {
            list-style: none;
        }

        aside ul li {
            margin-bottom: 0.8rem;
        }

        aside ul li a {
            color: #555;
            text-decoration: none;
            cursor: pointer;
        }

        aside ul li a:hover {
            color: var(--accent-color);
        }

        /* Modal for Reading Article */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            border-radius: 8px;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #888;
        }

        .modal-body {
            margin-top: 1.5rem;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .modal-body h2 {
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .modal-body p {
            margin-bottom: 1.2rem;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        footer a {
            color: #ccc;
            text-decoration: none;
            margin: 0 0.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>테크 & 정보 라이브러리</h1>
        <nav>
            <a onclick="filterCategory('all')">전체보기</a>
            <a onclick="filterCategory('IT/테크')">IT/테크</a>
            <a onclick="filterCategory('생산성')">생산성</a>
            <a onclick="openPrivacyPolicy()">개인정보처리방침</a>
        </nav>
    </header>

    <div class="container">
        <main>
            <!-- 상단 애드센스 영역 -->
            <div class="ads-area">
                [구글 애드센스 상단 광고 영역 - 승인 후 자동게재]
            </div>

            <h2 id="category-title" style="margin-bottom: 1.5rem;">전체 글 목록</h2>

            <!-- 카드 형태의 글 목록 -->
            <div class="posts-grid" id="posts-container">
                <!-- JavaScript를 통해 본문 데이터가 로드됩니다. -->
            </div>

            <!-- 하단 애드센스 영역 -->
            <div class="ads-area">
                [구글 애드센스 하단 광고 영역]
            </div>
        </main>

        <!-- 사이드바 -->
        <aside>
            <h3>카테고리</h3>
            <ul>
                <li><a onclick="filterCategory('all')">전체 보기</a></li>
                <li><a onclick="filterCategory('IT/테크')">IT/테크 정보</a></li>
                <li><a onclick="filterCategory('생산성')">업무 생산성 팁</a></li>
            </ul>

            <div class="ads-area" style="margin-top: 2rem; height: 250px; display: flex; align-items: center; justify-content: center;">
                [사이드바 광고]
            </div>
        </aside>
    </div>

    <!-- 본문 열람용 모달 -->
    <div class="modal" id="post-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body" id="modal-body-content">
                <!-- 클릭한 글의 본문 내용이 이곳에 표시됩니다 -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 테크 & 정보 라이브러리. All rights reserved.</p>
        <p style="margin-top: 0.5rem;">
            <a onclick="openPrivacyPolicy()">개인정보처리방침</a> | 
            <a onclick="openContact()">문의하기</a>
        </p>
    </footer>

    <script>
        // 자체 작성 글 데이터베이스 (승인용 콘텐츠)
        const blogPosts = [
            {
                id: 1,
                category: "IT/테크",
                title: "2026년 인공지능 도구 활용법 및 생산성 향상 가이드",
                summary: "최신 AI 기술을 활용하여 일상 업무 및 창작 활동의 효율성을 200% 이상 끌어올리는 실제 적용 방법과 추천 도구를 상세히 소개합니다.",
                content: `
                    <h2>2026년 인공지능 도구 활용법 및 생산성 향상 가이드</h2>
                    <p>인공지능 기술은 단순한 자동화를 넘어 이제 개인의 생산성을 확장하는 핵심 파트너로 자리 잡았습니다. 이번 글에서는 일상 업무와 프로젝트 관리에 AI 도구를 실질적으로 적용하는 방법에 대해 깊이 있게 다루어 보겠습니다.</p>
                    <h3>1. 워크플로우에 AI 도입하기</h3>
                    <p>업무 효율을 극대화하기 위해서는 먼저 반복적인 텍스트 작업이나 데이터 정리 프로세스를 파악해야 합니다. 이메일 작성, 회의록 요약, 자료 조사 등의 작업은 AI 생성 모델을 활용해 시간을 대폭 단축할 수 있습니다.</p>
                    <h3>2. 프롬프트 엔지니어링의 기본</h3>
                    <p>AI로부터 원하는 최선의 결과를 얻어내기 위해서는 '명확한 맥락 제공'과 '역할 부여'가 필수적입니다. 단순히 질문을 던지는 것에 그치지 않고, AI에게 전문가의 페르소나를 지정해 주고 구체적인 출력 형식을 요구하는 것이 핵심입니다.</p>
                    <p>결론적으로, AI 도구를 적절히 결합하면 기존 업무에 소요되던 시간을 크게 줄이고 보다 창의적인 기획과 의사결정에 집중할 수 있습니다.</p>
                `
            },
            {
                id: 2,
                category: "생산성",
                title: "효율적인 시간 관리를 위한 시간 블록(Time Blocking) 기법",
                summary: "하루를 효율적으로 분할하여 몰입도를 높이고 집중력을 극대화하는 시간 블록 기법의 개념과 적용 단계를 설명합니다.",
                content: `
                    <h2>효율적인 시간 관리를 위한 시간 블록 기법</h2>
                    <p>많은 직장인과 크리에이터들이 멀티태스킹의 늪에 빠져 집중력을 잃곤 합니다. 이를 해결하는 가장 강력한 시간 관리 프레임워크가 바로 '시간 블록(Time Blocking)' 기법입니다.</p>
                    <h3>1. 시간 블록이란 무엇인가?</h3>
                    <p>시간 블록이란 하루 일정표를 마치 벽돌을 쌓듯 특정 작업 전용 시간대로 분할하는 방식입니다. 이 시간 동안은 오직 지정된 한 가지 업무에만 전념하며, 이메일 확인이나 SNS 등의 방해 요소를 완전히 차단합니다.</p>
                    <h3>2. 실전 적용 3단계</h3>
                    <p>첫째, 하루 중 가장 집중력이 높은 시간을 '딥 워크(Deep Work)' 시간으로 배정하세요. 둘째, 유사한 성격의 자잘한 업무(이메일 답장, 일정 정리)는 '배치 작업(Batching)'으로 묶어서 처리합니다. 셋째, 예상치 못한 차질에 대비해 30분 정도의 여유 시간을 일정 사이에 배치합니다.</p>
                    <p>이 기법을 지속적으로 실천하면 집중력 유지에 소요되는 에너지 소비를 줄이고 퇴근 시간 전까지 목표한 성과를 달성할 수 있습니다.</p>
                `
            },
            {
                id: 3,
                category: "IT/테크",
                title: "초보자를 위한 웹 사이트 성능 및 SEO 최적화 기초",
                summary: "검색 엔진에 내 사이트를 원활히 노출하고 사용자 경험을 개선하기 위한 기본 SEO 요소와 속도 최적화 팁을 알아봅니다.",
                content: `
                    <h2>초보자를 위한 웹 사이트 성능 및 SEO 최적화 기초</h2>
                    <p>웹사이트를 개설한 후 많은 방문자를 유치하기 위해서는 검색 엔진 최적화(SEO)와 빠른 웹 로딩 속도가 필수적으로 뒷받침되어야 합니다.</p>
                    <h3>1. 시맨틱 HTML 구조의 중요성</h3>
                    <p>검색 엔진 로봇은 웹페이지의 HTML 구조를 해석하여 콘텐츠의 가치를 평가합니다. header, nav, main, article, footer와 같은 시맨틱 태그를 적절히 사용하는 것만으로도 검색 엔진이 사이트의 구조를 파악하는 데 큰 도움이 됩니다.</p>
                    <h3>2. 로딩 속도 개선 방법</h3>
                    <p>이미지 용량 최적화, 불필요한 자바스크립트 코드 축소, 캐싱 활용은 사이트 속도를 높이는 기본 수단입니다. 로딩 속도가 빠를수록 사용자 이탈률이 낮아지며 검색 엔진 순위에도 긍정적인 영향을 미칩니다.</p>
                `
            }
        ];

        // 글 목록 출력
        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openPost(post.id);
                card.innerHTML = `
                    <span class="category">${post.category}</span>
                    <h3>${post.title}</h3>
                    <p>${post.summary}</p>
                `;
                container.appendChild(card);
            });
        }

        // 카테고리 필터링
        function filterCategory(cat) {
            const title = document.getElementById('category-title');
            if(cat === 'all') {
                title.innerText = "전체 글 목록";
                renderPosts(blogPosts);
            } else {
                title.innerText = `${cat} 관련 글`;
                const filtered = blogPosts.filter(p => p.category === cat);
                renderPosts(filtered);
            }
        }

        // 상세 본문 열기
        function openPost(id) {
            const post = blogPosts.find(p => p.id === id);
            if(post) {
                document.getElementById('modal-body-content').innerHTML = post.content;
                document.getElementById('post-modal').style.display = 'flex';
            }
        }

        // 개인정보처리방침 (입력해주신 이메일 적용)
        function openPrivacyPolicy() {
            document.getElementById('modal-body-content').innerHTML = `
                <h2>개인정보처리방침 (Privacy Policy)</h2>
                <p>본 웹사이트는 방문자의 개인정보를 중요시하며 관련 법률을 준수합니다.</p>
                <p>1. 수집하는 개인정보 항목: 쿠키, 방문 기록, IP 정보 등 (구글 애드센스 및 타사 쿠키 포함)</p>
                <p>2. 개인정보 수집 목적: 사용자 맞춤형 콘텐츠 및 광고 제공, 웹사이트 이용 통계 분석</p>
                <p>3. 쿠키 사용: 구글을 포함한 제3자 제공업체는 쿠키를 사용하여 사용자의 이전 방문 기록을 바탕으로 광고를 게재합니다.</p>
                <p>4. 개인정보 관련 문의: yeonjun050727@gmail.com</p>
            `;
            document.getElementById('post-modal').style.display = 'flex';
        }

        // 문의하기 (입력해주신 이메일 적용)
        function openContact() {
            document.getElementById('modal-body-content').innerHTML = `
                <h2>문의하기 (Contact Us)</h2>
                <p>사이트 이용 및 기타 문의사항은 아래 이메일로 연락주시기 바랍니다.</p>
                <p style="margin-top: 1rem;"><strong>이메일:</strong> <a href="mailto:yeonjun050727@gmail.com">yeonjun050727@gmail.com</a></p>
            `;
            document.getElementById('post-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('post-modal').style.display = 'none';
        }

        // 모달 외부 클릭 시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('post-modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        window.onload = () => {
            renderPosts(blogPosts);
        };
    </script>
</body>
</html>
