            display: flex;

            height: 190px;
            overflow: hidden;
            background-color: #eef1f5;
            position: relative;

            border-radius: 4px;

            font-weight: 700;

        const posts = [
            {
                id: 1,
                category: "IT/스마트폰",
                title: "아이폰 싸게 사는 법, 비싸게 사는 사람들은 이걸 놓칩니다",
                date: "2026. 09. 23",
                thumb: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?auto=format&fit=crop&w=800&q=80",
                snippet: "아이폰을 사려 할 때 매장 직원의 말만 듣고 덜컥 구매하면 수십만 원을 손해볼 수 있습니다. 자급제 카드 할인과 통신사 약정 결합을 정밀하게 비교해 알뜰하게 구매하는 실전 가이드입니다.",
                content: `“아이폰은 원래 비싼 거 아닌가?” 아이폰을 새로 사려고 하면 대부분 한 번쯤 이런 생각을 하게 됩니다. 가격을 검색해보면 생각보다 비싸고, 그렇다고 오래된 모델을 사자니 괜히 아쉬운 느낌도 들기 마련이죠. 그래서 결국 매장에 가서 직원분이 추천해주는 방법으로 덜컥 구매하는 경우가 많습니다. 하지만 아이폰은 어디서, 어떻게 구매하느냐에 따라 내가 부담하는 금액을 꽤 다르게 만들 수 있답니다.

특히 아이폰을 살 때는 단순히 “이 모델 얼마예요?”만 물어보면 객관적인 가격 비교가 어렵습니다. 자급제인지, 통신사 구매인지, 기존 휴대폰을 반납하는지, 요금제는 얼마인지까지 종합적으로 봐야 하기 때문입니다. 오늘은 아이폰을 처음 구매하는 분들도 쉽게 따라 할 수 있도록 아이폰 싸게 사는 법을 하나씩 정리해드릴게요.

<h2>1. 최신 아이폰부터 무조건 찾지 마세요</h2>
아이폰을 사려고 하면 가장 먼저 최신 모델부터 검색하게 됩니다. 물론 최신 제품을 원하는 사람이라면 당연히 최신 모델을 선택하면 됩니다. 하지만 예산을 줄이는 것이 목적이라면 이전 세대 아이폰도 반드시 비교해보는 게 좋습니다. 새로운 모델이 출시됐다고 해서 이전 모델이 갑자기 못 쓰는 스마트폰이 되는 건 아니니까요. 평소에 카카오톡, 인터넷 검색, 유튜브, 사진 촬영, 음악 감상, SNS 정도만 사용하는 분이라면 굳이 가장 비싼 최신 모델만 고집할 필요가 없을 수도 있습니다. 오히려 이전 세대 모델의 할인 가격을 확인해보면 예상보다 훨씬 괜찮은 조건을 발견할 수 있어요.

<h2>2. 아이폰 자급제 가격부터 확인해 보세요</h2>
아이폰을 싸게 사고 싶다면 자급제 가격을 먼저 확인해 보는 것이 기본입니다. 자급제폰은 통신사와 별도로 단말기를 구매한 뒤 원하는 요금제를 선택할 수 있기 때문이죠. 여기서 중요한 건 정가만 보는 게 아니라 실제 카드 할인이 적용된 결제금액을 보는 것입니다. 다만 카드 할인은 구매 전 조건 및 제한사항을 정확히 확인해야 합니다. “최대 20만 원 할인!”이라는 문구가 눈에 들어오더라도 실제 내가 그 조건(특정 카드사, 전월 실적 등)을 충족할 수 있는지 꼼꼼히 따져보세요.

<h2>3. 통신사 구매 조건도 꼼꼼 비교</h2>
자급제만 알아보는 것도 아쉽습니다. 통신사를 통해 구매할 경우에도 공시지원금이나 선택약정 할인 조건이 적용될 수 있기 때문입니다. 구매하려는 아이폰 모델과 사용하려는 요금제 수준에 따라 조건이 천차만별로 달라집니다. 구매 전 최소한 통신사 구매(단말기 가격 + 요금제 + 약정 할인), 자급제 구매(자급제 단말기 할인 + 알뜰폰/선택약정 요금제), 그리고 중고 및 이전 세대 모델 비교까지 3가지 선택지를 한눈에 비교해 보고 최종 금액이 가장 낮은 방향을 선택해 보세요.

<h2>4. '월 납부금 얼마'라는 상술에 속지 마세요</h2>
대리점이나 매장에서 가장 흔히 쓰는 말 중 하나가 바로 "손님, 매달 4만 원만 내시면 최신 아이폰 가져가실 수 있어요!"라는 방식의 안내입니다. 이것은 36개월 혹은 48개월 할부를 설정해서 매달 내는 금액을 착시 효과로 낮춰 보이는 전형적인 마케팅 기술입니다. 할부 기간이 길어질수록 고율의 할부 이자(연 5.9%)를 소비자가 부담하게 됩니다. 따라서 계약 시에는 매월 내는 요금에 속지 마시고, 24개월 또는 전체 계약 기간 동안 내게 되는 '최종 기기 총금액'과 '통신요금 합산액'을 서면으로 적어서 비교하셔야 안전합니다.`
            },
            {
                id: 2,
                category: "금융/테크",
                title: "초보 운전자 필수 체크! 첫 자동차보험 다이렉트 가입 성공 가이드",

                snippet: "첫 자동차보험료로 150~200만 원 견적을 받고 당황하셨나요? 운전 경력 인정과 부모님 공동명의 지분 설정을 통해 첫 보험료를 절반 이상 낮추는 실전 노하우를 알려드립니다.",

<h2>1. 기존 청약통장에서 전환 신청하는 법</h2>
이미 일반 주택청약종합저축이나 청년 우대형 청약통장을 갖고 계신 분들도 자격 요건(만 19~34세, 연 소득 5,000만 원 이하 무주택자)만 충족하면 '청년 주택드림 청약통장'으로 즉시 전환이 가능합니다.
전환 시 기존 통장에서 납입했던 금액과 회차, 인정 가점이 100% 그대로 승계되므로 가점 불이익 걱정 없이 은행 앱(우리, KB국민, 신한, 하나, NH농협 등)에서 비대면으로 간편하게 신청해 보세요!

<h2>2. 최저 연 2.2% 청년 주택드림 대출 연계 조건</h2>
이 통장의 핵심 하이라이트는 바로 청약 당첨 후 연계되는 **'청년 주택드림 대출'**입니다!
- 지원 대상: 청년 주택드림 통장에 1년 이상 가입 및 1,000만 원 이상 납입 실적이 있는 자
- 대상 주택: 분양가 6억 원 이하, 전용면적 85㎡ 이하 주택
- 대출 혜택: 분양가의 최대 80%까지 최저 연 2.2% 금리로 최장 40년 만기 대출 제공 (결혼, 출산 시 추가 우대금리 적용)

<h2>3. 매월 얼마씩 납입하는 것이 유리할까요?</h2>
청약 통장의 월 납입 인정 한도가 늘어난 만큼, 가성비 있게 청약 가점을 쌓고 싶다면 월 10만 원에서 최대 25만 원 사이로 꾸준히 자동이체를 설정해 두는 것을 강력히 권장합니다. 목돈 마련과 내 집 마련이라는 두 마리 토끼를 한 번에 잡으세요!`
            }
        ];

        let currentCategory = "전체";

        // 그리드 카드 랜더링
        function renderGrid() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = "";

            const filtered = currentCategory === "전체" 
                ? posts 
                : posts.filter(p => p.category === currentCategory);

            filtered.forEach(post => {
                const card = document.createElement('article');
                card.className = 'post-card';
                card.onclick = () => openModal(post.id);

                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${post.thumb}" alt="${post.title}" class="thumb-img" loading="lazy">
                    </div>
                    <div class="card-body-preview">
                        <div class="card-meta">
                            <span class="category-badge">${post.category}</span>
                            <span class="post-date">${post.date}</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-snippet">${post.snippet}</p>
                        <div class="read-more-link">본문 읽기 ➔</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 카테고리 필터
        function filterCat(catName) {
            currentCategory = catName;
            document.querySelectorAll('.cat-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent === catName);
            });
            renderGrid();
        }

        // 모달 열기
        function openModal(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('mCategory').textContent = post.category;
            document.getElementById('mDate').textContent = post.date;
            document.getElementById('mTitle').textContent = post.title;
            document.getElementById('mImg').src = post.thumb;
            document.getElementById('mBody').innerHTML = post.content;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOnOuter(e) {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        }

        // 초기 실행
        renderGrid();
    </script>
</body>
</html>
