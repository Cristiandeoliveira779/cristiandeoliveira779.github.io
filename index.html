<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 블로그 허브</title>
  
  <!-- [1] 구글 애드센스 승인/연동 코드 (발급받은 ca-pub-XXXXX 값으로 변경) -->
  <!-- 
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> 
  -->

  <!-- 프리텐다드 웹폰트 -->
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-sub: #475569;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* 애드센스 광고 영역 스타일 */
    .adsense-box {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 25px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* 블로그 섹션 */
    .blog-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .blog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .blog-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .visit-btn {
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .visit-btn:hover {
      background-color: var(--primary-hover);
    }

    .blog-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- [상단 애드센스 광고 영역] -->
  <div class="adsense-box">
    <!-- 승인 후 여기에 구글 애드센스 광고 코드(ins 태그)를 넣습니다 -->
    📢 광고 영역 (구글 애드센스 승인 후 배너 노출)
  </div>

  <!-- 1번 블로그 연결 -->
  <div class="blog-card">
    <div class="blog-header">
      <h2 class="blog-title">💡 실생활 유용한 정보</h2>
      <a class="visit-btn" href="https://blog.naver.com/blogforyou_" target="_blank">블로그 바로가기</a>
    </div>
    <p class="blog-desc">일상생활에서 바로 활용할 수 있는 각종 꿀팁과 정보들을 확인해 보세요!</p>
  </div>

  <!-- 2번 블로그 연결 -->
  <div class="blog-card">
    <div class="blog-header">
      <h2 class="blog-title">🛍️ 상품 리뷰 & 추천</h2>
      <a class="visit-btn" href="https://blog.naver.com/727--" target="_blank">블로그 바로가기</a>
    </div>
    <p class="blog-desc">가성비 좋은 추천 아이템과 솔직한 사용 후기 모음입니다.</p>
  </div>

  <!-- 3번 블로그 연결 -->
  <div class="blog-card">
    <div class="blog-header">
      <h2 class="blog-title">📰 국내외 이슈 & 트렌드</h2>
      <a class="visit-btn" href="https://blog.naver.com/tip-foryou" target="_blank">블로그 바로가기</a>
    </div>
    <p class="blog-desc">최신 뉴스, 트렌드 이슈를 가장 빠르게 전달해 드립니다.</p>
  </div>

  <!-- [하단 애드센스 광고 영역] -->
  <div class="adsense-box">
    📢 광고 영역 (구글 애드센스 승인 후 배너 노출)
  </div>

</div>

</body>
</html>
