<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 페이지 기본 정보 -->
  <title>통합 블로그 Hub</title>
  <meta name="description" content="3개 블로그의 최신 포스팅을 한눈에 확인하세요.">

  <!-- 오픈 그래프 (Open Graph) 메타 태그 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="통합 블로그 Hub">
  <meta property="og:title" content="나의 통합 블로그 Hub">
  <meta property="og:description" content="3개 블로그의 최신 포스팅을 한눈에 확인하세요.">
  
  <!-- ★ Cloudflare Worker 무작위 대표 이미지 주소 ★ -->
  <meta property="og:image" content="https://random-og-image.yeonjun050727.workers.dev">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- 트위터 카드 (Twitter Card) 메타 태그 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="나의 통합 블로그 Hub">
  <meta name="twitter:description" content="3개 블로그의 최신 포스팅을 한눈에 확인하세요.">
  <meta name="twitter:image" content="https://random-og-image.yeonjun050727.workers.dev">

  <style>
    /* 기본 기본 스타일링 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #111;
    }
    p {
      color: #666;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .blog-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .blog-button {
      display: block;
      padding: 14px 20px;
      background-color: #03cf5d; /* 네이버 대표 색상 */
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .blog-button:hover {
      background-color: #02b350;
      transform: translateY(-2px);
    }
    .blog-button.second {
      background-color: #2db400;
    }
    .blog-button.third {
      background-color: #1ec800;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>통합 블로그 Hub</h1>
    <p>아래 링크를 통해 원하는 블로그로 이동하실 수 있습니다.</p>

    <div class="blog-links">
      <!-- 3개 블로그 실제 주소로 href 링크를 수정해 주세요 -->
      <a href="https://blog.naver.com/" class="blog-button" target="_blank">첫 번째 블로그 방문하기 (blogforyou_)</a>
      <a href="https://blog.naver.com/" class="blog-button second" target="_blank">두 번째 블로그 방문하기 (727--)</a>
      <a href="https://blog.naver.com/" class="blog-button third" target="_blank">세 번째 블로그 방문하기 (tip-foryou)</a>
    </div>
  </div>

</body>
</html>
