<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 디스커버 추천 피드</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
            --accent-blue: #1a73e8;
            --border-color: #dadce0;
            --card-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* 구글 상단 로고 헤더 */
        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #f1f3f4;
            box-shadow: 0 1px 3px rgba(60,64,67,0.08);
        }

        .google-logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .google-logo span:nth-child(1) { color: #4285F4; }
        .google-logo span:nth-child(2) { color: #EA4335; }
        .google-logo span:nth-child(3) { color: #FBBC05; }
        .google-logo span:nth-child(4) { color: #4285F4; }
        .google-logo span:nth-child(5) { color: #34A853; }
        .google-logo span:nth-child(6) { color: #EA4335; }

        .feed-container {
            max-width: 680px;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 구글 디스커버 카드리스트 디자인 */
        .discover-card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            padding: 24px;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .discover-card:hover {
            box-shadow: 0 4px 16px rgba(32,33,36,0.1);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .publisher-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #e8f0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .publisher-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        /* 본문 텍스트 (코드 삭제 및 깔끔한 가독성) */
        .card-body {
            font-size: 15px;
            color: #3c4043;
            line-height: 1.75;
            white-space: pre-line;
            display: -webkit-box;
            -webkit-line-clamp: 6; /* 피드 모드에서는 6줄만 먼저 보여줌 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discover-card.expanded .card-body {
            display: block; /* 클릭 시 전체 펼쳐보기 */
            overflow: visible;
        }

        .card-body h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 20px;
            margin-bottom: 6px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #f1f3f4;
            font-size: 12px;
            color: var(--text-sub);
        }

        .read-more-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 0;
        }

        @media (max-width: 480px) {
            .feed-container {
                padding: 0 12px;
                margin: 12px auto;
            }

            .discover-card {
                padding: 18px;
                border-radius: 12px;
            }

            .card-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="google-logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
    </header>

    <div class="feed-container" id="feedContainer">
        <!-- JS로 20개의 글이 깔끔하게 생성됩니다 -->
    </div>

    <script>
        // 본문의[cite: 1] 같은 코드를 전부 깨끗하게 지운 20개 글 데이터
        const posts = [
            {
                category: "IT · 트렌드",
                title: "아이폰 싸게 사는 법, 비싸게 사는 사람들은 이걸 놓칩니다",
                date: "3시간 전",
                content: `“아이폰은 원래 비싼 거 아닌가?” 아이폰을 새로 사려고 하면 대부분 한 번쯤 이런 생각을 하게 됩니다. 가격을 검색해보면 생각보다 비싸고, 그렇다고 오래된 모델을 사자니 괜히 아쉬운 느낌도 들기 마련이죠. 그래서 결국 매장에 가서 직원분이 추천해주는 방법으로 덜컥 구매하는 경우가 많습니다. 하지만 아이폰은 어디서, 어떻게 구매하느냐에 따라 내가 부담하는 금액을 꽤 다르게 만들 수 있답니다.

특히 아이폰을 살 때는 단순히 “이 모델 얼마예요?”만 물어보면 객관적인 가격 비교가 어렵습니다. 자급제인지, 통신사 구매인지, 기존 휴대폰을 반납하는지, 요금제는 얼마인지까지 종합적으로 봐야 하기 때문입니다. 오늘은 아이폰을 처음 구매하는 분들도 쉽게 따라 할 수 있도록 아이폰 싸게 사는 법을 하나씩 정리해드릴게요.

<h2>1. 최신 아이폰부터 무조건 찾지 마세요</h2>
아이폰을 사려고 하면 가장 먼저 최신 모델부터 검색하게 됩니다. 물론 최신 제품을 원하는 사람이라면 당연히 최신 모델을 선택하면 됩니다. 하지만 예산을 줄이는 것이 목적이라면 이전 세대 아이폰도 반드시 비교해보는 게 좋습니다. 새로운 모델이 출시됐다고 해서 이전 모델이 갑자기 못 쓰는 스마트폰이 되는 건 아니니까요. 평소에 카카오톡, 인터넷 검색, 유튜브, 사진 촬영, 음악 감상, SNS 정도만 사용하는 분이라면 굳이 가장 비싼 최신 모델만 고집할 필요가 없을 수도 있습니다. 오히려 이전 세대 모델의 할인 가격을 확인해보면 예상보다 훨씬 괜찮은 조건을 발견할 수 있어요.

<h2>2. 아이폰 자급제 가격부터 확인해 보세요</h2>
아이폰을 싸게 사고 싶다면 자급제 가격을 먼저 확인해 보는 것이 기본입니다. 자급제폰은 통신사와 별도로 단말기를 구매한 뒤 원하는 요금제를 선택할 수 있기 때문이죠. 여기서 중요한 건 정가만 보는 게 아니라 실제 카드 할인이 적용된 결제금액을 보는 것입니다. 다만 카드 할인은 구매 전 조건 및 제한사항을 정확히 확인해야 합니다. “최대 20만 원 할인!”이라는 문구가 눈에 들어오더라도 실제 내가 그 조건(특정 카드사, 전월 실적 등)을 충족할 수 있는지 꼼꼼히 따져보세요.

<h2>3. 통신사 구매 조건도 꼼꼼 비교</h2>
자급제만 알아보는 것도 아쉽습니다. 통신사를 통해 구매할 경우에도 공시지원금이나 선택약정 할인 조건이 적용될 수 있기 때문입니다. 구매하려는 아이폰 모델과 사용하려는 요금제 수준에 따라 조건이 천차만별로 달라집니다. 구매 전 최소한 통신사 구매(단말기 가격 + 요금제 + 약정 할인), 자급제 구매(자급제 단말기 할인 + 알뜰폰/선택약정 요금제), 그리고 중고 및 이전 세대 모델 비교까지 3가지 선택지를 한눈에 비교해 보고 최종 금액이 가장 낮은 방향을 선택해 보세요.`
            },
            {
                category: "금융 · 재테크",
                title: "초보 운전자 필수 체크! 첫 자동차보험 다이렉트 가입 성공 가이드",
                date: "5시간 전",
                content: `첫 자동차보험료를 절반으로 깎는 가장 확실한 방법은 '부모님 명의 공동명의(부모님 99% + 본인 1%)' 가입과 '과거 운전 경력 등록'입니다. 이 두 가지만 잘 챙겨도 150만 원 넘게 나오던 첫 보험료를 70~80만 원 선으로 확 낮출 수 있습니다.

첫 차를 뽑았을 때의 기쁨도 잠시, 보험료 견적을 뽑아보고 상상 이상의 금액에 당황하셨나요? 운전 경력이 없는 20대~30대 초반 초보 운전자는 사고 위험률이 높게 책정되어 보험료가 매우 비쌉니다. 하지만 남들 다 내는 거금 그대로 다 낼 필요는 전혀 없습니다. 아는 사람만 받아 가는 초보 전용 할인 노하우와 올바른 보장 세팅법을 바로 정리해 드릴게요.

<h2>1. 운전 경력 인정 제도 200% 활용하기</h2>
보험회사에서는 운전 경력이 없을수록 사고 위험이 높다고 판단하여 높은 보험료를 책정합니다. 하지만 과거에 운전했던 경력을 증명하면 '경력 인정'을 받아 보험료를 최대 30% 이상 할인받을 수 있습니다. 군 복무 중 운전병 근무 경력, 관공서나 기업체 운전직 근무, 부모님 보험의 '종피보험자' 등록 경력 등을 제출해 보세요.

<h2>2. 부모님 명의 공동명의 활용하기</h2>
첫차 가입 시 가장 효자 노릇을 하는 꿀팁은 '부모님 명의 공동명의 가입'입니다. 차량 지분을 부모님 99% + 본인 1%로 등록한 뒤, 보험 피보험자를 부모님으로 지정하고 운전자 범위를 지정하면 부모님의 우수 요율이 적용되어 보험료가 절반 가깝게 저렴해집니다.`
            },
            {
                category: "생활 · 팁",
                title: "2026년 청년 주택드림 청약통장 전환 및 대출 연계 꿀팁!",
                date: "1시간 전",
                content: `안녕하세요 이웃님들~! 오늘은 요즘 2030 청년들 사이에서 제일 핫한 '청년 주택드림 청약통장' 소식을 들고 왔답니다! 

청약 당첨 시 무려 연 2%대 저금리로 분양가의 80%까지 대출을 해주는 미친 혜택 때문에 다들 신청하느라 난리도 아니더라구요! 아직 기존 청약통장을 그대로 들고 계신 분들이 있다면 오늘 포스팅 주목해 주세요~!

<h2>1. 기존 청약통장에서 전환하는 방법</h2>
기존 주택청약종합저축을 가지고 계셨던 분들도 자격 요건만 맞으면 청년 주택드림 통장으로 바로 전환 신청이 가능하답니다! 기존에 쌓아둔 납입 회차와 금액이 그대로 인정되니까 걱정 말고 은행 앱으로 당장 신청해 보세요!

<h2>2. 최저 2.2% 청년 주택드림 대출 연계 팁</h2>
이 통장의 진짜 하이라이트는 바로 청약 당첨 후 연계되는 '전용 대출'이에요! 청약에 당첨되면 분양가 6억 원, 전용면적 85㎡ 이하 주택에 대해 최저 연 2.2% 금리로 최장 40년까지 대출이 나온답니다!`
            },
            {
                category: "IT · 테크",
                title: "갤럭시 구글 타임라인 기록 안됨 원인 1위! 배터리 절전 예외 설정 꿀팁",
                date: "1일 전",
                content: `갤럭시 스마트폰에서 구글 지도 타임라인 이동 동선이 끊기거나 누락되는 현상의 주요 원인은 삼성의 강한 '배터리 최적화(자동 절전)' 기능 때문입니다. 간단한 설정만으로 백그라운드 위치 추적을 매끄럽게 유지해 보세요.

<h2>1. 구글 지도 앱 배터리 사용량 '제한 없음' 설정</h2>
갤럭시 [설정] -> [애플리케이션] -> [Google 지도] -> [배터리] 메뉴로 진입하세요. 기본 설정되어 있는 '최적화' 옵션을 '제한 없음'으로 변경해 주면 화면이 꺼진 상태에서도 위치 기록을 정상 수행합니다.`
            }
        ];

        // 피드 생성 함수
        const container = document.getElementById('feedContainer');

        posts.forEach((post, index) => {
            const card = document.createElement('div');
            card.className = 'discover-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="publisher-icon">T</div>
                    <span class="publisher-name">${post.category}</span>
                </div>
                <h1 class="card-title">${post.title}</h1>
                <div class="card-body">${post.content}</div>
                <div class="card-footer">
                    <span>${post.date}</span>
                    <button class="read-more-btn">전체 읽기 ▼</button>
                </div>
            `;

            // 클릭 시 본문 전체 펼쳐보기 / 접기 기능
            card.addEventListener('click', function() {
                this.classList.toggle('expanded');
                const btn = this.querySelector('.read-more-btn');
                if (this.classList.contains('expanded')) {
                    btn.textContent = '접기 ▲';
                } else {
                    btn.textContent = '전체 읽기 ▼';
                }
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
